<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LilRobbsGirlfriend • 3D preview</title><style>body{margin:0;background:#101923;color:#fff;font:16px system-ui}header{padding:14px 18px}h1{font-size:1.25rem;margin:0}p{margin:7px 0;color:#ccd8e2}canvas{display:block;width:100%;height:68vh;touch-action:none;background:radial-gradient(circle at 50% 35%,#283c4b,#101923)}footer{padding:12px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:12px;border-radius:9px;background:#2d5269;color:white;border:1px solid #7293a7}a{color:#a9e5ff}</style></head><body><header><h1>LilRobbsGirlfriend — 3D concept viewer</h1><p>Drag to rotate • pinch or scroll to zoom • concept only, not production CAD</p></header><canvas id="scene" aria-label="Interactive three dimensional rover concept"></canvas><footer><button id="reset">Reset view</button><button id="explode">Explode parts</button><span>Approx. 304 × 232 mm chassis, 98 mm wheels</span><a href="https://github.com/matthagersenior/lilrobbsgirlfriend/blob/main/cad/companion.scad">Source CAD</a></footer><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let yaw=.7,pitch=.42,zoom=1,explode=false;let last=null,pinch=null;
function box(cx,cy,cz,w,d,h,col){let p=[];for(let x of [-1,1])for(let y of [-1,1])for(let z of [-1,1])p.push([cx+x*w/2,cy+y*d/2,cz+z*h/2]);const ix=(x,y,z)=>(x+1)*4+(y+1)*2+(z+1);const faces=[[ix(-1,-1,-1),ix(-1,1,-1),ix(-1,1,1),ix(-1,-1,1)],[ix(1,-1,-1),ix(1,1,-1),ix(1,1,1),ix(1,-1,1)],[ix(-1,-1,-1),ix(1,-1,-1),ix(1,-1,1),ix(-1,-1,1)],[ix(-1,1,-1),ix(1,1,-1),ix(1,1,1),ix(-1,1,1)],[ix(-1,-1,1),ix(1,-1,1),ix(1,1,1),ix(-1,1,1)]];return faces.map((f,i)=>({p:f.map(j=>p[j]),col,shade:[.65,.83,.7,.9,1][i]}))}
function disc(cx,cy,cz,r,thick,col){let n=16,faces=[];for(let i=0;i<n;i++){let a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n;faces.push({p:[[cx+r*Math.cos(a),cy-thick/2,cz+r*Math.sin(a)],[cx+r*Math.cos(b),cy-thick/2,cz+r*Math.sin(b)],[cx+r*Math.cos(b),cy+thick/2,cz+r*Math.sin(b)],[cx+r*Math.cos(a),cy+thick/2,cz+r*Math.sin(a)]],col,shade:.65});}faces.push({p:Array.from({length:n},(_,i)=>[cx+r*Math.cos(i*2*Math.PI/n),cy+thick/2,cz+r*Math.sin(i*2*Math.PI/n)]),col,shade:.9});return faces}
function render(){let w=c.clientWidth,h=c.clientHeight,dpr=Math.min(devicePixelRatio||1,2);c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let parts=[];parts.push(...box(0,0,28,304,232,46,'#e09c43'));parts.push(...box(0,0,57+(explode?55:0),260,200,16,'#557f91'));parts.push(...box(0,0,120+(explode?120:0),108,96,76,'#78a9c4'));parts.push(...box(0,-49,143+(explode?120:0),30,8,22,'#162b39'));for(let x of [-106,106])for(let y of [-130,130])parts.push(...disc(x,y,49,49,24,'#252a31'));parts.push(...box(-10,0,48+(explode?65:0),110,70,18,'#35694f'));parts.push(...box(65,0,47+(explode?65:0),55,65,15,'#aab9bf'));
function rot(p){let [x,y,z]=p;let X=x*Math.cos(yaw)-y*Math.sin(yaw),Y=x*Math.sin(yaw)+y*Math.cos(yaw);return [X,Y*Math.sin(pitch)-z*Math.cos(pitch),Y*Math.cos(pitch)+z*Math.sin(pitch)]}let scale=Math.min(w/500,h/430)*zoom;let sorted=parts.map(f=>{let pts=f.p.map(rot);return {...f,pts,depth:pts.reduce((s,p)=>s+p[2],0)/pts.length}}).sort((a,b)=>a.depth-b.depth);for(let f of sorted){let [r,g,b]=[1,3,5].map((_,i)=>parseInt(f.col.slice(1+i*2,3+i*2),16));ctx.fillStyle='rgb('+[r,g,b].map(v=>Math.round(v*f.shade)).join(',')+')';ctx.beginPath();f.pts.forEach((p,i)=>{let x=w/2+p[0]*scale,y=h*.54+p[1]*scale;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();ctx.strokeStyle='#172530';ctx.lineWidth=.8;ctx.stroke();}}
function pointer(e){if(last){yaw+=(e.clientX-last.x)*.009;pitch=Math.max(-1.25,Math.min(1.25,pitch+(e.clientY-last.y)*.007));render()}last={x:e.clientX,y:e.clientY};}
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY}});c.addEventListener('pointermove',e=>{if(e.buttons)pointer(e)});c.addEventListener('pointerup',()=>last=null);c.addEventListener('pointercancel',()=>last=null);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.45,Math.min(2.5,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});
c.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
c.addEventListener('touchmove',e=>{if(e.touches.length===2){let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(.45,Math.min(2.5,zoom*n/pinch));pinch=n;render()}},{passive:true});
document.querySelector('#reset').onclick=()=>{yaw=.7;pitch=.42;zoom=1;explode=false;render()};document.querySelector('#explode').onclick=()=>{explode=!explode;render()};window.addEventListener('resize',render);render();
</script></body></html>
